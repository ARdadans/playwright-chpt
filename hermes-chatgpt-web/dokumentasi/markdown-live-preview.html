<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Live Preview</title>
  
  <!-- Marked.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1e293b;
      padding: 12px 20px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f8fafc;
    }

    .badge {
      background: #3b82f6;
      color: white;
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 500;
    }

    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #334155;
    }

    .panel:last-child {
      border-right: none;
    }

    .panel-header {
      background: #1e293b;
      padding: 10px 16px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-header button {
      background: #334155;
      color: #e2e8f0;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.7rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .panel-header button:hover {
      background: #475569;
    }

    textarea {
      flex: 1;
      width: 100%;
      background: #0f172a;
      color: #e2e8f0;
      border: none;
      outline: none;
      padding: 20px;
      font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
      resize: none;
    }

    textarea::placeholder {
      color: #64748b;
    }

    #preview {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      background: #0f172a;
      line-height: 1.75;
    }

    /* Markdown Preview Styles */
    #preview h1, #preview h2, #preview h3, #preview h4 {
      margin-top: 1.4em;
      margin-bottom: 0.6em;
      color: #f1f5f9;
      font-weight: 600;
    }

    #preview h1 { font-size: 1.8rem; border-bottom: 1px solid #334155; padding-bottom: 0.3em; }
    #preview h2 { font-size: 1.45rem; }
    #preview h3 { font-size: 1.25rem; }

    #preview p {
      margin-bottom: 1em;
      color: #cbd5e1;
    }

    #preview ul, #preview ol {
      margin: 0.8em 0 1em 1.6em;
      color: #cbd5e1;
    }

    #preview li {
      margin-bottom: 0.3em;
    }

    #preview code {
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 0.9em;
      color: #7dd3fc;
    }

    #preview pre {
      background: #1e293b;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 1em 0;
      border: 1px solid #334155;
    }

    #preview pre code {
      background: transparent;
      padding: 0;
      color: #e2e8f0;
    }

    #preview blockquote {
      border-left: 4px solid #3b82f6;
      padding-left: 16px;
      margin: 1em 0;
      color: #94a3b8;
      font-style: italic;
    }

    #preview a {
      color: #60a5fa;
      text-decoration: none;
    }

    #preview a:hover {
      text-decoration: underline;
    }

    #preview table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.2em 0;
    }

    #preview th, #preview td {
      border: 1px solid #334155;
      padding: 8px 12px;
      text-align: left;
    }

    #preview th {
      background: #1e293b;
      color: #f1f5f9;
    }

    #preview img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 1.2em 0;
      display: block;
    }

    #preview hr {
      border: none;
      border-top: 1px solid #334155;
      margin: 2em 0;
    }

    #preview strong {
      color: #f1f5f9;
      font-weight: 600;
    }

    #preview em {
      color: #e2e8f0;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .panel {
        border-right: none;
        border-bottom: 1px solid #334155;
        max-height: 50%;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Markdown Live Preview</h1>
    <span class="badge">Live</span>
  </header>

  <div class="container">
    <!-- Input Panel -->
    <div class="panel">
      <div class="panel-header">
        <span>Raw Input (dari API)</span>
        <button onclick="loadExample()">Load Contoh</button>
      </div>
      <textarea id="markdownInput" placeholder="Paste data dari REST API di sini..."></textarea>
    </div>

    <!-- Preview Panel -->
    <div class="panel">
      <div class="panel-header">Live Preview</div>
      <div id="preview"></div>
    </div>
  </div>

  <script>
    // Konfigurasi marked.js
    marked.setOptions({
      breaks: true,
      gfm: true,
      headerIds: false,
      mangle: false
    });

    const input = document.getElementById('markdownInput');
    const preview = document.getElementById('preview');

    /**
     * Decode string yang masih dalam kondisi escaped
     * Handle kasus seperti:
     * - \n → newline
     * - \u003C → <
     * - \u003E → >
     * - \" → "
     */
    function decodeEscapedString(str) {
      if (!str) return '';

      // Cara paling aman: coba treat sebagai JSON string literal
      try {
        // Bungkus dengan quote supaya JSON.parse bisa decode \uXXXX dan \n
        return JSON.parse('"' + str
          .replace(/\\/g, '\\\\')
          .replace(/"/g, '\\"')
          .replace(/\n/g, '\\n')
          .replace(/\r/g, '\\r')
          .replace(/\t/g, '\\t') + '"');
      } catch (e) {
        // Fallback manual
        return str
          .replace(/\\u003[cC]/g, '<')
          .replace(/\\u003[eE]/g, '>')
          .replace(/\\u0026/g, '&')
          .replace(/\\u0027/g, "'")
          .replace(/\\u0022/g, '"')
          .replace(/\\n/g, '\n')
          .replace(/\\r/g, '\r')
          .replace(/\\t/g, '\t')
          .replace(/\\"/g, '"')
          .replace(/\\\\/g, '\\');
      }
    }

    /**
     * Proses: decode escaped → parse markdown → render HTML
     */
    function updatePreview() {
      const raw = input.value;
      const decoded = decodeEscapedString(raw);
      preview.innerHTML = marked.parse(decoded);
    }

    // Live update saat mengetik / paste
    input.addEventListener('input', updatePreview);

    // Contoh data sesuai yang kamu berikan
    function loadExample() {
      // Ini adalah string dalam kondisi masih escaped (seperti dari raw JSON)
      input.value = `Keesokan harinya di sekolah, Sua bertatapan dengan seorang siswa laki-laki yang belum pernah dilihatnya sebelumnya.\\n\\n*Siapa dia?*\\n\\nSaat jam istirahat, anak laki-laki itu lebih dulu menghampirinya dan mengajak bicara.\\n\\n\\"Hai. Namaku Lee Hyun-woo. Kau juga seorang **Awakened**, kan?\\"\\n\\nSua terkejut dan mundur selangkah.\\n\\n\\"Eh, bagaimana kau bisa tahu...\\"\\n\\n\\"Aku bisa merasakannya. Aku juga termasuk golongan yang sama.\\"\\n\\nHyun-woo membuka telapak tangannya. Sesaat kemudian, nyala api biru muncul dari ujung jarinya.\\n\\n\\u003Cimg src=\\"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjic14Kuvt0jzZ94VVy7H9P2XsTPFbxdkTNX2FBlpyLiRGF0wcPW521ZVT5p1yy9VvP14fEt6CIf0pVQHqx57ixhvb8RPaYlerQIcxr4bI3wxY31_BrYlJoYBxTv-VzyZr0q2XLBqbpD0U/s0-rw/isekai+yurutto+page.webp\\" alt=\\"현우의 손에서 피어오르는 푸른 불꽃\\"\\u003E\\n\\n\\u003Cimg src=\\"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjic14Kuvt0jzZ94VVy7H9P2XsTPFbxdkTNX2FBlpyLiRGF0wcPW521ZVT5p1yy9VvP14fEt6CIf0pVQHqx57ixhvb8RPaYlerQIcxr4bI3wxY31_BrYlJoYBxTv-VzyZr0q2XLBqbpD0U/s0/isekai+yurutto+page.webp\\" width=\\"300\\" alt=\\"Description\\"\\u003E\\"Ini teknik bernama **Blue Flame**. Hanya orang-orang yang tergabung dalam **Awakened Alliance** yang bisa mempelajarinya.\\"\\n\\n\\"Awakened... Alliance?\\"\\n\\n\\"Organisasi yang mengawasi dan melindungi orang-orang yang terbangun seperti kita. Kau juga akan segera mengetahuinya.\\"\\n\\nSua tiba-tiba teringat suara yang didengarnya dari luar jendela tadi malam. Mungkinkah suara itu ada hubungannya dengan organisasi tersebut, pikirnya.`;
      updatePreview();
    }

    // Render awal
    updatePreview();

    // ============================================
    // Cara pakai dari REST API
    // ============================================
    /*
    async function loadFromAPI() {
      try {
        const res = await fetch('https://api.example.com/chapter/1');
        const data = await res.json();

        // Option 1: Kalau response.json() sudah otomatis decode \n dan \u003C
        // input.value = data.content;

        // Option 2: Kalau datanya masih raw escaped string
        input.value = data.content;
        updatePreview();
      } catch (err) {
        console.error(err);
      }
    }
    */
  </script>
</body>
</html>
